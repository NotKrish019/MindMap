<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MindMap - Break Screen</title>

                    "surface-tint": "#6d3bd7",

                    "surface-container-high": "#ede5f3",
                    "tertiary": "#765700",
                    "primary-fixed": "#e9ddff",
                    "secondary": "#a43073",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f5eefb",
                    "on-background": "#1d1a23",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-fixed-dim": "#f9bd22",

            "spacing": {
                    "sm": "12px",
                    "gutter": "20px",
                    "md": "24px",
                    "base": "8px",
                    "xs": "4px",
                    "margin": "24px",
                    "xl": "64px",
                    "lg": "40px"
            },
            "fontFamily": {
                    "h3": ["Epilogue"],
                    "label-caps": ["Lexend"],
                    "h2": ["Epilogue"],

          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .breathing-animation {
            animation: breathe 8s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); border-width: 2.5px; }
            50% { transform: scale(1.15); border-width: 8px; }
        }
        .bg-dots {
            background-image: radial-gradient(#1A1A1A 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            opacity: 0.1;
        }
    </style>
</head>
<body class="bg-primary text-on-primary min-h-screen overflow-hidden flex flex-col items-center justify-center font-body-md relative">
<!-- Polka Dot Background Layer -->
<div class="absolute inset-0 bg-dots pointer-events-none"></div>
<!-- Decorative "Wild Decoration" Stickers -->
<div class="absolute top-12 left-8 -rotate-12 bg-secondary text-white px-4 py-2 border-[2.5px] border-zinc-900 shadow-[4px_4px_0px_0px_#1A1A1A] rounded-full font-label-caps">
        PAUSE
    </div>
<div class="absolute bottom-24 right-12 rotate-6 bg-tertiary-fixed text-tertiary px-6 py-3 border-[2.5px] border-zinc-900 shadow-[6px_6px_0px_0px_#1A1A1A] rounded-xl font-label-bold flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="energy_savings_leaf">energy_savings_leaf</span>
        MIND OVER MATTER
    </div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center gap-12 max-w-md w-full px-6 text-center">
<!-- Breathing Circle Section -->
<div class="relative group">
<!-- Pulsing Outer Ring -->
<div class="breathing-animation absolute inset-0 rounded-full bg-primary-container opacity-20 blur-xl"></div>
<!-- Main Breathing Circle -->
<div class="breathing-animation w-64 h-64 md:w-80 md:h-80 rounded-full bg-surface-container-lowest border-[2.5px] border-zinc-900 shadow-[12px_12px_0px_0px_#1A1A1A] flex items-center justify-center relative z-20">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-6xl text-primary" data-icon="cloud" data-weight="fill" style="font-variation-settings: 'FILL' 1;">cloud</span>
</div>
<!-- Floating Small Accents -->
<div class="absolute -top-4 -right-4 w-12 h-12 bg-secondary-container rounded-full border-[2.5px] border-zinc-900 shadow-[3px_3px_0px_0px_#1A1A1A] flex items-center justify-center">
<span class="material-symbols-outlined text-zinc-900 text-sm" data-icon="sparkles">colors_spark</span>
</div>
</div>
</div>
<!-- Text Guidance -->
<div class="space-y-4">
<h1 class="font-h1 text-on-primary-container">Take a deep breath.</h1>
<p class="font-body-lg text-on-primary-fixed-variant max-w-[280px] mx-auto opacity-80">
                Let your thoughts settle like dust in a quiet room.
            </p>
</div>
<!-- Sticker-style End Break Button -->
<div class="mt-8">
<button class="bg-surface-container-lowest hover:bg-zinc-50 text-zinc-900 font-label-bold border-[2.5px] border-zinc-900 shadow-[6px_6px_0px_0px_#1A1A1A] active:shadow-none active:translate-x-[2px] active:translate-y-[2px] px-10 py-4 rounded-xl transition-all flex items-center gap-3">
<span class="material-symbols-outlined" data-icon="close">close</span>
                End Break
            </button>
</div>
</main>
<!-- Visual Anchor - Decorative Corner Element -->
<div class="fixed bottom-[-20px] left-[-20px] w-48 h-48 opacity-10 pointer-events-none">
<svg class="w-full h-full fill-white" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="40" stroke="currentColor" stroke-width="2"></circle>
<circle cx="50" cy="50" fill="none" r="30" stroke="currentColor" stroke-width="2"></circle>
<circle cx="50" cy="50" fill="none" r="20" stroke="currentColor" stroke-width="2"></circle>
</svg>
</div>
<!-- Hidden shell components per instructions to prioritize focus -->
<!-- TopAppBar & BottomNavBar suppressed due to "Task-Focused" rule -->
<!-- Placeholder Image for Context (if needed, styled as a subtle card) -->
<div class="absolute top-1/4 -right-24 rotate-12 opacity-40">
<img class="w-48 h-64 object-cover border-[2.5px] border-zinc-900 rounded-2xl shadow-[8px_8px_0px_0px_#1A1A1A]" data-alt="A macro photograph of delicate purple flower petals with soft morning dew drops. The image is bathed in calming lavender and violet tones, fitting a serene mental wellness app aesthetic. The lighting is diffused and ethereal, creating a sense of peace and renewal consistent with a mindfulness break screen." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUsVLh8MISTDJxxkrU-GmO70zsaiBw-XYTXBFQKpugfwvBObguU3scEVedJaR4v5Zpti1atL12kLj2jkfrwjU0jLJifZ0FyHpVumqYeu6yufsRwBWQa-t3GtZB6EQXKqjXBs0v2ID5ex4WVbB-sCyibbvSdk9qad9U_Kv6PVR966mrG6rHQ1E3OThorDw1I0d2FZ4eKC2QKUzqqhR20wHzf2H4nzPNV5dodaKJvl2J2nR0EUQncW4ekKSUuVg0JHi0p9CmWEO7wm4"/>
</div>
